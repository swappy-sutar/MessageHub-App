version: "3.9"

# ============================================================
# docker-compose.yml — MessageHub Production Stack
# Services: Backend API, Coturn TURN/STUN, Redis
# ============================================================
#
# Usage:
#   Development:   docker-compose up
#   Production:    docker-compose -f docker-compose.yml up -d
# ============================================================

services:
  # ── Node.js Backend (API + Socket.IO Signaling) ──────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: messagehub-backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis
    networks:
      - messagehub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Coturn TURN/STUN Server ───────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: messagehub-coturn
    restart: unless-stopped
    network_mode: host   # TURN requires direct host network for UDP relay
    volumes:
      - ./coturn.conf:/etc/turnserver.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
      - coturn-logs:/var/log/coturn
    command: -c /etc/turnserver.conf
    environment:
      # Override the static-auth-secret at runtime via env
      - STATIC_AUTH_SECRET=${TURN_SECRET_KEY}
    healthcheck:
      test: ["CMD", "nc", "-zu", "localhost", "3478"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (Presence Store + Socket.IO Pub/Sub Adapter) ───────
  redis:
    image: redis:7-alpine
    container_name: messagehub-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - messagehub-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  coturn-logs:

networks:
  messagehub-net:
    driver: bridge
