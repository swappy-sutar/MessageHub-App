# ============================================================
# coturn.conf — Production Coturn TURN/STUN Configuration
# ============================================================
#
# Place this file at /etc/turnserver.conf on your server.
# Replace all <PLACEHOLDER> values with your actual values.
#
# References:
#   https://github.com/coturn/coturn/wiki/turnserver
#   https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
# ============================================================

# ── Network ──────────────────────────────────────────────────
# Listening port (UDP + TCP)
listening-port=3478

# TLS/DTLS listening port
tls-listening-port=5349

# Public IPv4 address of this server (REQUIRED in production)
external-ip=<YOUR_SERVER_PUBLIC_IP>

# ── TLS Certificates ─────────────────────────────────────────
# TLS is mandatory in production — prevents credential sniffing.
cert=/etc/ssl/certs/<YOUR_CERT>.pem
pkey=/etc/ssl/private/<YOUR_KEY>.pem

# ── Realm ─────────────────────────────────────────────────────
realm=messagehub.example.com
server-name=messagehub.example.com

# ── Authentication ────────────────────────────────────────────
# Long-term credential mechanism (HMAC-SHA1)
# Use time-limited credentials from your backend for production.
lt-cred-mech

# Static user for dev/test (DELETE in production — use dynamic creds)
# user=turnuser:turnpassword

# Shared secret for time-limited HMAC credentials generated by backend
use-auth-secret
static-auth-secret=<YOUR_TURN_SECRET_KEY_256BIT>

# ── Relay Subnets (Security) ──────────────────────────────────
# Deny relaying to private/loopback addresses (RFC 1918 protection)
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# ── Transport ─────────────────────────────────────────────────
# Allow UDP and TCP
no-udp=false
no-tcp=false

# Disable raw UDP proxy (security hardening)
no-udp-relay=false
no-tcp-relay=false

# ── Bandwidth & Sessions ──────────────────────────────────────
# Maximum allocation quota per user
max-bps=1000000     # 1 Mbps per relay channel
bps-capacity=10000000  # 10 Mbps total server capacity

# Session lifetime limit (seconds)
max-allocate-lifetime=3600
default-allocation-quota=50

# ── Logging ───────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
verbose
# Simple statistics for monitoring
stale-nonce=3600

# ── Fingerprinting ────────────────────────────────────────────
fingerprint

# ── Process ───────────────────────────────────────────────────
proc-user=turnserver
proc-group=turnserver
pidfile=/var/run/turnserver.pid
